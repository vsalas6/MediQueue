<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MediQueue</title>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <!-- Bootstrap Link-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- CSS Link -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <!--NavBar-->
            <nav class="navbar">
                <div class="navdiv">
                    <a href="index.html">
                        <img src="images/logo.png" alt="logo of mediqueue">
                    </a>

                    <!-- Checkbox toggle -->
                    <input type="checkbox" id="menu-toggle" class="menu-toggle">

                    <!-- Hamburger icon -->
                    <label for="menu-toggle" class="hamburger">&#9776;</label>

                    <!-- Nav -->
                    <ul class="nav-menu">
                        <li><a href="check-in.html">Check-In</a></li>
                        <li><a href="queue-status.html">Queue Status</a></li>
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="FAQ.html">FAQ</a></li>
                        <li><a href="contact.html">Contact Us</a></li>
                    </ul>
                </div>
            </nav>
        </header>
        <!-- Main -->
        <main>
            <div class="main-check-in">
                <h1>Patient Check-In</h1>
                <p>Check in online and track your wait time in real time to make visits faster and stress-free.</p>
            </div>
         
            <!-- Patient Check In Form -->
            <form action="#" class="check-in-form">
                <!-- First Name -->
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname"><br>

                <!-- Last Name -->
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname"><br>

                <!-- Reason for Visit -->
                <label for="reason">Reason For Visit:</label>
                <select name="reason" id="reason">
                    <option value="" selected disabled>Please select a reason...</option>
                    <option value="check-up">Check Up</option>
                    <option value="new-symptom">New Symptom</option>
                    <option value="follow-up">Follow Up</option>
                    <option value="lab-work">Lab Work</option>
                    <option value="vaccination">Vaccination</option>
                </select><br>

                <!-- Appointment Type (Walk In / Scheduled) -->
                <label for="type">Appointment Type:</label>
                <select name="type" id="type">
                    <option value="" selected disabled>Please select a type...</option>
                    <option value="walk-in">Walk In</option>
                    <option value="scheduled">Scheduled</option>
                </select><br>

                <!-- Phone Number -->
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"><br>

                <!-- Confirmation -->
                <div class="confirm-container">
                    <input type="checkbox" id="confirm" name="confirm">
                    <label for="confirm">I confirm my information is correct.</label>
                </div>

                <!-- Join Queue -->
                <div class="join-queue">
                    <label for="confirm"></label>
                    <button>Join Queue</a></button>
                </div>
            </form>
        </main>
        <!-- Footer -->
        <footer>
            <p>Phone</p>
            <p>Email</p>
            <p>Privacy Policy</p>
            <p><a href="login.html">Staff Login</a></p>
        </footer>
    </body>
</html>
